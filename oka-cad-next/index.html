<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>岡重機 CAD NEXT 0.1</title>
  <link rel="stylesheet" href="./style.css?v=0.1.0">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">OKA JUKI CAD</div>
      <h1>CAD NEXT <small>0.1</small></h1>
    </div>
    <div class="topActions">
      <button id="undoBtn" disabled>↶</button>
      <button id="redoBtn" disabled>↷</button>
    </div>
  </header>

  <main>
    <section class="openRow">
      <label class="primaryBtn fileBtn" for="fileInput">📂 STEP / STLを開く</label>
      <input id="fileInput" type="file" accept=".step,.stp,.stl" hidden>
      <button id="demoBtn">デモ形状</button>
      <button id="fitBtn" disabled>全体表示</button>
    </section>

    <section class="viewerCard">
      <div id="viewer"></div>
      <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingText">読込中…</span></div>
      <div class="modeBar">
        <button id="partModeBtn">部品</button>
        <button id="faceModeBtn" class="active">面</button>
      </div>
      <div class="axisBar hidden" id="axisBar">
        <button data-axis="x">X</button>
        <button data-axis="y">Y</button>
        <button data-axis="z">Z</button>
      </div>
      <div id="status" class="status">STEP / STLを開くか「デモ形状」を押してください</div>
    </section>

    <section class="infoStrip">
      <div><span>部品</span><strong id="partCount">0</strong></div>
      <div><span>選択</span><strong id="selectedKind">—</strong></div>
      <div><span>面</span><strong id="selectedFace">—</strong></div>
    </section>

    <section class="panel">
      <div class="panelHead">
        <div>
          <div class="eyebrow">SELECTION</div>
          <h2 id="selectionTitle">未選択</h2>
        </div>
        <span id="faceType" class="pill">—</span>
      </div>
      <div id="selectionInfo" class="selectionInfo">3Dモデルの面をタップしてください。</div>
    </section>

    <section class="panel editPanel">
      <div class="panelHead">
        <div>
          <div class="eyebrow">GIZMO + NUMERIC</div>
          <h2>面移動コマンド</h2>
        </div>
        <span class="pill">mm</span>
      </div>

      <div class="axisChoice">
        <button class="axisBtn" data-axis="x">X</button>
        <button class="axisBtn" data-axis="y">Y</button>
        <button class="axisBtn" data-axis="z">Z</button>
      </div>

      <div class="quickNudge">
        <button data-delta="-1">−1.0</button>
        <button data-delta="-0.5">−0.5</button>
        <button data-delta="-0.2">−0.2</button>
        <button data-delta="0.2">+0.2</button>
        <button data-delta="0.5">+0.5</button>
        <button data-delta="1">+1.0</button>
      </div>

      <div class="numericRow">
        <label>移動量
          <input id="moveAmount" type="number" inputmode="decimal" step="0.1" value="1.0">
        </label>
        <button id="applyPreviewBtn" class="primaryBtn" disabled>プレビュー</button>
      </div>

      <div class="previewReadout">
        <span>プレビュー位置</span>
        <strong id="previewValue">X 0.00 / Y 0.00 / Z 0.00 mm</strong>
      </div>

      <button id="resetPreviewBtn" class="wideBtn" disabled>プレビューを0に戻す</button>

      <p class="note">
        0.1は「面選択・Gizmo・数値入力・Undo」の新しい土台です。
        黄色の面だけを安全にプレビュー移動し、元のSTEP/STL形状はまだ書き換えません。
      </p>
    </section>

    <section class="panel">
      <div class="panelHead">
        <div>
          <div class="eyebrow">HISTORY</div>
          <h2>編集コマンド履歴</h2>
        </div>
        <span id="historyCount" class="pill">0</span>
      </div>
      <div id="historyList" class="historyList"><div class="empty">まだコマンドはありません</div></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }}
  </script>
  <script type="module" src="./app.js?v=0.1.0"></script>
</body>
</html>
