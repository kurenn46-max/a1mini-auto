name: STEP Editor AI V4 UI Smoke

on:
  push:
    paths:
      - 'step-editor-ai-v4/**'
      - '.github/workflows/step-editor-ai-v4-ui-smoke.yml'
  workflow_dispatch:

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8000 > /tmp/step-editor-ai-v4-http.log 2>&1 &
          sleep 2
      - name: Run AI V4 browser test
        run: node step-editor-ai-v4/tests/ui-smoke.cjs
