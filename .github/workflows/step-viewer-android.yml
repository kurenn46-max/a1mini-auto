name: Build Android STEP Viewer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-step-viewer/**'
      - '.github/workflows/step-viewer-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20

      - name: Build debug APK
        run: gradle -p android-step-viewer assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-step-viewer/app/build/outputs/apk/debug/app-debug.apk OkaStepViewer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OkaStepViewer-APK
          path: OkaStepViewer.apk
          if-no-files-found: error
