<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>ふたりカレンダー</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginView" class="view login-view">
    <div class="login-card">
      <div class="app-mark">2</div>
      <h1>ふたりカレンダー</h1>
      <p>2人だけで予定を共有するシンプルカレンダー</p>
      <label>メールアドレス<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></label>
      <label>パスワード<input id="password" type="password" autocomplete="current-password" placeholder="8文字以上"></label>
      <button id="loginBtn" class="primary">ログイン</button>
      <details class="register-box">
        <summary>初回登録</summary>
        <p>1人目は登録コードを入力。招待された2人目は空欄のままでOK。</p>
        <label>1人目の登録コード（2人目は空欄）<input id="ownerCode" type="text" autocomplete="one-time-code" placeholder="1人目だけ入力"></label>
        <button id="signupBtn" class="ghost">登録する</button>
      </details>
      <p id="loginMsg" class="msg" role="status"></p>
    </div>
  </div>

  <div id="appView" class="view app-view hidden">
    <header class="topbar">
      <button id="prevBtn" class="icon-btn" aria-label="前の月">‹</button>
      <div class="month-title-wrap">
        <button id="monthTitle" class="month-title" type="button"></button>
        <button id="todayBtn" class="today-btn" type="button">今日</button>
      </div>
      <button id="nextBtn" class="icon-btn" aria-label="次の月">›</button>
    </header>

    <div class="utility-row">
      <div class="legend">
        <span><i class="dot mine"></i>自分</span>
        <span><i class="dot partner"></i>相手</span>
      </div>
      <div class="utility-actions">
        <button id="inviteBtn" class="mini-btn hidden" type="button">2人目を招待</button>
        <button id="logoutBtn" class="mini-btn" type="button">ログアウト</button>
      </div>
    </div>

    <main id="swipeArea" class="calendar-shell">
      <div class="weekdays"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span><span class="sun">日</span></div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </main>

    <button id="fab" class="fab" aria-label="予定を追加">＋</button>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="eventSheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div><div id="sheetDate" class="sheet-date"></div><h2 id="sheetTitle">予定を追加</h2></div>
      <button id="closeSheet" class="close-btn" type="button">×</button>
    </div>
    <label class="field">予定<input id="eventTitle" type="text" maxlength="120" placeholder="例：○○現場"></label>
    <div class="time-row">
      <label class="field">開始<input id="startTime" type="time"></label>
      <label class="field">終了<input id="endTime" type="time"></label>
    </div>
    <label class="field">メモ<textarea id="eventMemo" rows="2" maxlength="500" placeholder="任意"></textarea></label>
    <label class="check"><input id="allDay" type="checkbox"> 時間なし</label>
    <input id="editingId" type="hidden">
    <div class="sheet-actions">
      <button id="deleteBtn" class="danger hidden" type="button">削除</button>
      <button id="saveBtn" class="primary" type="button">保存</button>
    </div>
  </section>

  <div id="inviteBackdrop" class="backdrop hidden"></div>
  <section id="inviteSheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div><div class="sheet-date">2人だけの共有</div><h2>2人目を招待</h2></div>
      <button id="closeInvite" class="close-btn" type="button">×</button>
    </div>
    <p class="invite-help">相手のメールアドレスを登録すると、そのメールだけ2人目として入れます。</p>
    <label class="field">相手のメールアドレス<input id="inviteEmail" type="email" inputmode="email" placeholder="partner@example.com"></label>
    <p id="inviteMsg" class="msg" role="status"></p>
    <div class="sheet-actions">
      <button id="replaceInviteBtn" class="ghost hidden" type="button">招待先を変更</button>
      <button id="saveInviteBtn" class="primary" type="button">招待先を登録</button>
      <button id="shareInviteBtn" class="primary hidden" type="button">招待リンクを共有</button>
    </div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
