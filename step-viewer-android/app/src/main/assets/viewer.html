<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>岡重機 STEP Viewer</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f8fafc;background:#08111f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}button{font:inherit}
#app{height:100%;display:flex;flex-direction:column}
header{height:68px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f172a;border-bottom:1px solid #263246;z-index:10}
.title{flex:1;min-width:0}.title b{display:block;font-size:18px}.title small{display:block;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#overall{font-size:11px;background:#1e293b;padding:8px;border-radius:10px;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5;background:#08111f}
.card{width:min(480px,100%);border:1px solid #334155;background:#111827;border-radius:20px;padding:22px;text-align:center}
.card .icon{font-size:48px}.card h2{margin:8px 0}.card p{color:#cbd5e1;line-height:1.6}
.primary{border:0;border-radius:14px;background:#f59e0b;color:#111827;font-size:17px;font-weight:900;padding:14px 18px;width:100%}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020617d9;z-index:20;text-align:center}
#loading.show{display:flex}.spin{width:42px;height:42px;border:4px solid #334155;border-top-color:#f59e0b;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;z-index:30;background:#111827f2;border:1px solid #475569;border-radius:12px;padding:9px 12px;max-width:90%;text-align:center}
#info{position:absolute;left:10px;right:10px;bottom:10px;background:#111827eb;border:1px solid #334155;border-radius:14px;padding:10px 12px;z-index:8}
#infoName{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#infoDims{font-size:18px;margin-top:3px}#measureText{font-size:13px;color:#fbbf24;margin-top:4px;min-height:18px}
.toolbar{height:82px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:8px;background:#0f172a;border-top:1px solid #263246;z-index:10}
.tool{border:0;border-radius:13px;background:#1e293b;color:white;font-size:12px;font-weight:800}.tool .ico{display:block;font-size:22px;margin-bottom:4px}.tool.active{background:#b45309}
#drawer{position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:25;background:#0f172afa;border-top:1px solid #475569;border-radius:18px 18px 0 0;padding:8px 10px 14px;transform:translateY(110%);transition:.2s;pointer-events:none;visibility:hidden}
#drawer.open{transform:translateY(0);pointer-events:auto;visibility:visible}.handle{width:44px;height:4px;background:#64748b;border-radius:8px;margin:1px auto 9px}
.drawerHead{display:flex;gap:8px;align-items:center;margin-bottom:8px}.drawerHead b{flex:1}.small,.action{border:0;border-radius:10px;background:#334155;color:white;font-weight:800;padding:9px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}#parts{overflow:auto;max-height:calc(72vh - 120px)}
.part{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid #263246;background:transparent;color:white;padding:11px 9px}.part.active{background:#15345c;border-radius:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#60a5fa;flex:none}.pt{min-width:0;flex:1}.pn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pd{font-size:11px;color:#94a3b8;margin-top:2px}
#error{color:#fecaca;background:#3f1d1d;border:1px solid #7f1d1d;border-radius:10px;padding:10px;margin-top:12px;display:none;font-size:13px;word-break:break-word}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
<script src="./vendor/occt-import-js.js"></script>
</head>
<body>
<div id="app">
<header><div class="title"><b>岡重機 STEP Viewer</b><small id="fileName">FilesからSTEPを開いてください</small></div><div id="overall">X — × Y — × Z —</div></header>
<div id="stage">
  <div id="start"><div class="card"><div class="icon">📐</div><h2>STEP / STP / STL Viewer</h2><p>Filesで3Dファイルをタップして「岡重機 STEP Viewer」を選ぶか、下のボタンから開けます。</p><button class="primary" id="pickBtn">📂 端末からファイルを選ぶ</button><div id="error"></div></div></div>
  <div id="loading"><div><div class="spin"></div><div style="margin-top:12px">3Dデータを読み込み中…</div></div></div>
  <div id="toast"></div>
  <div id="info"><div id="infoName">未選択</div><div id="infoDims">X —　Y —　Z —</div><div id="measureText">パーツをタップするとサイズを表示</div></div>
  <div id="drawer"><div class="handle"></div><div class="drawerHead"><b>📦 パーツ <span id="partCount"></span></b><button class="small" id="closeDrawer">閉じる</button></div><div class="actions"><button class="action" id="showAll">全部表示</button><button class="action" id="isolate">単体表示</button><button class="action" id="ghost">他を半透明</button></div><div id="parts"></div></div>
</div>
<div class="toolbar">
  <button class="tool" id="openBtn"><span class="ico">📂</span>開く</button>
  <button class="tool" id="partsBtn"><span class="ico">📦</span>パーツ</button>
  <button class="tool" id="measureBtn"><span class="ico">📏</span>測る</button>
  <button class="tool" id="explodeBtn"><span class="ico">💥</span>分解</button>
  <button class="tool" id="fitBtn"><span class="ico">◎</span>全体</button>
</div>
</div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {STLLoader} from "three/addons/loaders/STLLoader.js";

const stage=document.getElementById("stage"),start=document.getElementById("start"),loading=document.getElementById("loading"),toast=document.getElementById("toast"),partsEl=document.getElementById("parts"),drawer=document.getElementById("drawer"),infoName=document.getElementById("infoName"),infoDims=document.getElementById("infoDims"),measureText=document.getElementById("measureText"),overall=document.getElementById("overall"),fileName=document.getElementById("fileName"),partCount=document.getElementById("partCount"),errorBox=document.getElementById("error");

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1020);
const camera=new THREE.PerspectiveCamera(45,1,.01,100000);camera.position.set(120,90,120);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.rotateSpeed=.65;controls.zoomSpeed=.9;controls.panSpeed=.8;
scene.add(new THREE.HemisphereLight(0xffffff,0x304050,2.1));const dl=new THREE.DirectionalLight(0xffffff,2.5);dl.position.set(100,160,120);scene.add(dl);const dl2=new THREE.DirectionalLight(0x9ec5ff,1.1);dl2.position.set(-100,-60,-80);scene.add(dl2);const grid=new THREE.GridHelper(400,40,0x334155,0x1f2937);grid.position.y=-1;scene.add(grid);scene.add(new THREE.AxesHelper(25));

let modelRoot=new THREE.Group();scene.add(modelRoot);let parts=[],meshToPart=new Map(),selectedPart=null,measureMode=false,explodeOn=false,assemblyCenter=new THREE.Vector3(),assemblyDiagonal=1,originalAssemblySize=new THREE.Vector3(),measurementPoints=[],measurementObjects=new THREE.Group(),occtPromise=null,loadingFile=false;scene.add(measurementObjects);const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();

function fmt(v){return Number.isFinite(v)?v.toFixed(v<10?2:1):"—"}function dimsText(v){return "X "+fmt(v.x)+" × Y "+fmt(v.y)+" × Z "+fmt(v.z)+" mm"}
function flash(msg){toast.textContent=msg;toast.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>toast.style.display="none",2200)}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(r.height,1);camera.updateProjectionMatrix()}addEventListener("resize",resize);resize();

function clearMeasure(){measurementPoints=[];while(measurementObjects.children.length){const o=measurementObjects.children.pop();o.geometry?.dispose();o.material?.dispose()}measureText.textContent=measureMode?"1点目をタップ":"パーツをタップするとサイズを表示"}
function disposeRoot(){scene.remove(modelRoot);modelRoot.traverse(o=>{o.geometry?.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())});modelRoot=new THREE.Group();scene.add(modelRoot);parts=[];meshToPart=new Map();selectedPart=null;clearMeasure()}
function makeMaterial(src){let c=new THREE.Color(0x9fb8d8);if(src&&src.length>=3){const mx=Math.max(...src);c=new THREE.Color(mx>1?src[0]/255:src[0],mx>1?src[1]/255:src[1],mx>1?src[2]/255:src[2])}return new THREE.MeshStandardMaterial({color:c,metalness:.05,roughness:.62,side:THREE.DoubleSide,transparent:true,opacity:1})}
function meshFromOcct(m){const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(m.attributes.position.array,3));if(m.attributes.normal?.array)g.setAttribute("normal",new THREE.Float32BufferAttribute(m.attributes.normal.array,3));else g.computeVertexNormals();if(m.index?.array)g.setIndex(Array.from(m.index.array));return new THREE.Mesh(g,makeMaterial(m.color))}
function uniqueName(name,i){let n=(name||"").trim();if(!n||/^(compound|solid)$/i.test(n))n="パーツ "+(i+1);return n}
function addPart(name,ids,src,used){const valid=ids.filter(i=>Number.isInteger(i)&&i>=0&&i<src.length&&!used.has(i));if(!valid.length)return;const pg=new THREE.Group(),p={name:uniqueName(name,parts.length),group:pg,meshes:[],size:new THREE.Vector3(),center:new THREE.Vector3(),explodeTarget:new THREE.Vector3()};valid.forEach(i=>{used.add(i);const m=meshFromOcct(src[i]);pg.add(m);p.meshes.push(m);meshToPart.set(m,p)});modelRoot.add(pg);parts.push(p)}
function walkNode(node,src,used,path){if(!node)return;const label=node.name||path||"";if(Array.isArray(node.meshes)&&node.meshes.length)addPart(label,node.meshes,src,used);if(Array.isArray(node.children))node.children.forEach((c,i)=>walkNode(c,src,used,label+" "+(i+1)))}
async function loadStep(bytes){if(!occtPromise){if(typeof window.occtimportjs!=="function")throw new Error("STEPエンジンを起動できません");occtPromise=window.occtimportjs({locateFile:p=>p.endsWith(".wasm")?"./vendor/occt-import-js.wasm":p})}const occt=await occtPromise;const r=occt.ReadStepFile(bytes,{linearUnit:"millimeter",linearDeflectionType:"bounding_box_ratio",linearDeflection:.001,angularDeflection:.5});if(!r?.success)throw new Error("STEP解析に失敗しました");const used=new Set();walkNode(r.root,r.meshes,used,"");r.meshes.forEach((m,i)=>{if(!used.has(i))addPart(m.name,[i],r.meshes,used)});if(!parts.length)throw new Error("表示できるパーツがありません")}
function loadStl(bytes){const g=new STLLoader().parse(bytes.buffer);g.computeVertexNormals();const m=new THREE.Mesh(g,makeMaterial(null)),pg=new THREE.Group();pg.add(m);modelRoot.add(pg);const p={name:"STL パーツ",group:pg,meshes:[m],size:new THREE.Vector3(),center:new THREE.Vector3(),explodeTarget:new THREE.Vector3()};parts=[p];meshToPart.set(m,p)}
function finalize(){modelRoot.updateMatrixWorld(true);const whole=new THREE.Box3().setFromObject(modelRoot);whole.getCenter(assemblyCenter);whole.getSize(originalAssemblySize);assemblyDiagonal=Math.max(originalAssemblySize.length(),1);parts.forEach((p,i)=>{const b=new THREE.Box3().setFromObject(p.group);b.getSize(p.size);b.getCenter(p.center);let d=p.center.clone().sub(assemblyCenter);if(d.length()<.001)d.set(Math.cos(i*2.399),.25*Math.sin(i),Math.sin(i*2.399));p.explodeTarget.copy(d.normalize().multiplyScalar(assemblyDiagonal*.23))});overall.textContent=dimsText(originalAssemblySize);partCount.textContent="("+parts.length+")";buildPartList();selectPart(parts[0]||null,false);fitCamera()}
async function readAndroidBytes(){const size=AndroidFile.getFileSize();if(!size)throw new Error("ファイルサイズが0です");const out=new Uint8Array(size),chunk=192*1024;for(let off=0;off<size;off+=chunk){const b64=AndroidFile.readChunk(off,Math.min(chunk,size-off));const bin=atob(b64);for(let i=0;i<bin.length;i++)out[off+i]=bin.charCodeAt(i);if((off/chunk)%8===0)await new Promise(r=>setTimeout(r,0))}return out}
window.loadAndroidFile=async function(){if(loadingFile||!window.AndroidFile||!AndroidFile.hasFile())return;loadingFile=true;errorBox.style.display="none";start.style.display="none";loading.classList.add("show");try{disposeRoot();const name=AndroidFile.getFileName()||"model.step";fileName.textContent=name;const bytes=await readAndroidBytes();const ext=(name.split(".").pop()||"").toLowerCase();if(ext==="stl")loadStl(bytes);else await loadStep(bytes);finalize();requestAnimationFrame(resize)}catch(e){console.error(e);start.style.display="flex";errorBox.textContent="読み込み失敗: "+(e.message||e);errorBox.style.display="block"}finally{loading.classList.remove("show");loadingFile=false}}
function buildPartList(){partsEl.innerHTML="";parts.forEach((p,i)=>{const b=document.createElement("button");b.className="part";const dot=document.createElement("span");dot.className="dot";const t=document.createElement("div");t.className="pt";const n=document.createElement("div");n.className="pn";n.textContent=(i+1)+". "+p.name;const d=document.createElement("div");d.className="pd";d.textContent=dimsText(p.size);t.append(n,d);b.append(dot,t);b.onclick=()=>selectPart(p,true);p.listEl=b;partsEl.appendChild(b)})}
function setAppearance(mode){parts.forEach(p=>p.meshes.forEach(m=>{m.visible=mode!=="isolate"||p===selectedPart;m.material.opacity=(mode==="ghost"&&selectedPart&&p!==selectedPart)?.12:1;m.material.depthWrite=!(mode==="ghost"&&selectedPart&&p!==selectedPart)}))}
function selectPart(p,fromList){selectedPart=p;parts.forEach(x=>{x.listEl?.classList.toggle("active",x===p);x.meshes.forEach(m=>{m.material.emissive.setHex(x===p?0x17345b:0);m.material.emissiveIntensity=x===p?.7:0})});if(p){infoName.textContent=p.name;infoDims.textContent=dimsText(p.size);if(!measureMode)measureText.textContent="このパーツの外形寸法";if(fromList){drawer.classList.remove("open");frameBox(new THREE.Box3().setFromObject(p.group))}}}
function fitCamera(){frameBox(new THREE.Box3().setFromObject(modelRoot))}function frameBox(box){if(box.isEmpty())return;const s=new THREE.Vector3(),c=new THREE.Vector3();box.getSize(s);box.getCenter(c);const max=Math.max(s.x,s.y,s.z,1),dist=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.65,d=new THREE.Vector3(1,.75,1).normalize();camera.position.copy(c).add(d.multiplyScalar(dist));camera.near=Math.max(dist/1000,.01);camera.far=Math.max(dist*50,1000);camera.updateProjectionMatrix();controls.target.copy(c);controls.update()}
function addMeasurePoint(p){if(measurementPoints.length>=2)clearMeasure();measurementPoints.push(p.clone());const r=Math.max(assemblyDiagonal*.008,.35),dot=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),new THREE.MeshBasicMaterial({color:0xf59e0b}));dot.position.copy(p);measurementObjects.add(dot);if(measurementPoints.length===1)measureText.textContent="2点目をタップ";else{const g=new THREE.BufferGeometry().setFromPoints(measurementPoints),line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xfbbf24}));measurementObjects.add(line);const d=measurementPoints[0].distanceTo(measurementPoints[1]);measureText.textContent="距離 "+d.toFixed(2)+" mm";flash("測定 "+d.toFixed(2)+" mm")}}
function pick(e){if(!parts.length)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(parts.flatMap(p=>p.meshes.filter(m=>m.visible)),false);if(!hits.length)return;if(measureMode)addMeasurePoint(hits[0].point);else{const p=meshToPart.get(hits[0].object);if(p)selectPart(p,false)}}
let down={x:0,y:0,t:0};renderer.domElement.addEventListener("pointerdown",e=>down={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener("pointerup",e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<500)pick(e)});
document.getElementById("pickBtn").onclick=()=>AndroidFile.pickFile();document.getElementById("openBtn").onclick=()=>AndroidFile.pickFile();document.getElementById("partsBtn").onclick=()=>drawer.classList.add("open");document.getElementById("closeDrawer").onclick=()=>drawer.classList.remove("open");document.getElementById("showAll").onclick=()=>setAppearance("all");document.getElementById("isolate").onclick=()=>selectedPart?setAppearance("isolate"):flash("パーツを選んでください");document.getElementById("ghost").onclick=()=>selectedPart?setAppearance("ghost"):flash("パーツを選んでください");document.getElementById("fitBtn").onclick=fitCamera;document.getElementById("measureBtn").onclick=e=>{measureMode=!measureMode;e.currentTarget.classList.toggle("active",measureMode);clearMeasure()};document.getElementById("explodeBtn").onclick=e=>{explodeOn=!explodeOn;e.currentTarget.classList.toggle("active",explodeOn);parts.forEach(p=>p.group.userData.target=explodeOn?p.explodeTarget.clone():new THREE.Vector3())};
function animate(){requestAnimationFrame(animate);parts.forEach(p=>{if(p.group.userData.target)p.group.position.lerp(p.group.userData.target,.12)});controls.update();renderer.render(scene,camera)}animate();
if(window.AndroidFile&&AndroidFile.hasFile())window.loadAndroidFile();
</script>
</body>
</html>
