<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <title>岡重機 3D Fit Test</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div>
      <h1>岡重機 3D Fit Test</h1>
      <p>STL仮組み・ヒンジ作動・干渉チェック</p>
    </div>
    <button id="fitViewBtn" class="ghost">全体表示</button>
  </header>

  <main>
    <section id="viewerWrap">
      <div id="viewer"></div>
      <div id="statusBadge" class="badge idle">STLを読み込んでください</div>
      <div id="pickHint" class="hint hidden">モデル上のヒンジ中心をタップ</div>
    </section>

    <section class="panel">
      <div class="row gap">
        <label class="fileBtn grow">STLを追加
          <input id="fileInput" type="file" accept=".stl,model/stl" multiple hidden />
        </label>
        <button id="clearBtn" class="danger">全消去</button>
      </div>
      <div id="partsList" class="parts empty">まだ部品がありません</div>
    </section>

    <section class="panel grid2">
      <label>固定部品
        <select id="fixedSelect"></select>
      </label>
      <label>可動部品
        <select id="movingSelect"></select>
      </label>
      <label>操作対象
        <select id="activeSelect"></select>
      </label>
      <label>移動操作
        <select id="transformMode">
          <option value="translate">移動</option>
          <option value="rotate">回転</option>
        </select>
      </label>
    </section>

    <section class="panel">
      <h2>ヒンジ軸</h2>
      <div class="axisRow">
        <button class="axis active" data-axis="x">X</button>
        <button class="axis" data-axis="y">Y</button>
        <button class="axis" data-axis="z">Z</button>
      </div>
      <div class="row gap">
        <button id="pickPivotBtn" class="primary grow">モデルをタップして軸中心設定</button>
        <button id="centerPivotBtn" class="ghost">可動部品中心</button>
      </div>
      <div class="xyz">
        <label>X<input id="pivotX" type="number" step="0.1" value="0"></label>
        <label>Y<input id="pivotY" type="number" step="0.1" value="0"></label>
        <label>Z<input id="pivotZ" type="number" step="0.1" value="0"></label>
      </div>
    </section>

    <section class="panel">
      <h2>作動テスト</h2>
      <div class="angleLine">
        <input id="angleSlider" type="range" min="0" max="180" step="1" value="0" />
        <strong><span id="angleValue">0</span>°</strong>
      </div>
      <div class="grid3">
        <label>開始°<input id="sweepFrom" type="number" value="0" step="1"></label>
        <label>終了°<input id="sweepTo" type="number" value="180" step="1"></label>
        <label>刻み°<input id="sweepStep" type="number" value="5" min="1" step="1"></label>
      </div>
      <div class="row gap">
        <button id="checkBtn" class="primary grow">現在角度を干渉チェック</button>
        <button id="sweepBtn" class="primary grow">全角度テスト</button>
      </div>
      <div id="result" class="result">固定部品と可動部品を選んでください。</div>
    </section>

    <section class="panel small">
      <b>使い方</b><br>
      ① STLを追加 → ② 固定/可動を選択 → ③ 必要なら移動ツールで位置合わせ → ④ ヒンジ中心をタップ → ⑤ X/Y/Z軸を選択 → ⑥ スライダーまたは全角度テスト。<br>
      <span class="muted">※ v1はSTL対応。干渉は三角メッシュ同士を判定します。STEP対応は次段階。</span>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
