<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#08111f">
  <title>岡重機 3D Auto Test</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div>
    <h1>岡重機 3D Auto Test</h1>
    <p>AI指示どおりに自動組立 → 自動作動 → 干渉判定</p>
  </div>
  <button id="fitBtn" class="ghost">全体表示</button>
</header>

<main>
  <section class="hero panel">
    <label class="big fileBtn">AIテストファイルを選ぶ
      <input id="packageInput" type="file" accept=".zip,.okafit" hidden>
    </label>
    <button id="lastBtn" class="big ghost" disabled>前回のテストを自動実行</button>
    <div class="muted small">テストファイルを1個選ぶだけ。組立・回転/直動・細かく見る区間・干渉判定は全部自動です。選んだファイルは端末に保存され、次回は「前回のテスト」で再実行できます。</div>
  </section>

  <section id="viewerWrap">
    <div id="viewer"></div>
    <div id="status" class="badge idle">テスト待ち</div>
    <div id="progress" class="progress hidden"><div id="progressBar"></div></div>
  </section>

  <section class="panel">
    <div class="row between">
      <div>
        <div class="eyebrow">テスト対象</div>
        <h2 id="testName">未読込</h2>
      </div>
      <button id="rerunBtn" class="ghost" disabled>もう一度</button>
    </div>
    <div id="plan" class="plan muted">テストファイルを読み込むと、ここにAIの作動テスト計画が出ます。</div>
  </section>

  <section class="panel">
    <div class="eyebrow">判定結果</div>
    <div id="summary" class="summary idle">まだテストしていません</div>
    <div id="results" class="results"></div>
  </section>

  <details>
    <summary class="panel detailsSummary">詳細表示</summary>
    <section class="panel small">
      <div id="partsInfo" class="muted">部品情報なし</div>
      <p class="muted">AIテスト指示は部品ごとに変えられます。回転・直動・複数区間・区間ごとの刻み幅に対応。たとえば閉じ際だけ1°刻み、その他は5°刻みにできます。</p>
    </section>
  </details>
</main>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
}}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
