<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>岡重機 揚程図ラインツール</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d1d5db;padding:8px}
h1{font-size:17px;margin:0 0 7px}.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.file{min-height:44px;border:1px solid #9ca3af;border-radius:9px;background:#fff;padding:7px 10px;font-weight:700}
button.active{background:#111827;color:#fff}.file{display:inline-flex;align-items:center}.file input{display:none}
label.small{display:flex;align-items:center;gap:5px;border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:3px 7px}
input[type=color]{width:38px;height:34px;border:0;padding:0;background:transparent}
select{border:0;background:#fff;min-height:34px}
#wrap{margin:8px;border:1px solid #9ca3af;border-radius:10px;overflow:auto;background:#d1d5db;min-height:60vh}
canvas{display:block;width:100%;height:auto;background:#fff;touch-action:none}
#status{margin:8px;padding:9px 11px;background:#111827;color:#fff;border-radius:9px;font-size:13px}
.help{margin:8px 10px 16px;color:#4b5563;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>岡重機 揚程図ラインツール</h1>
<div class="bar">
<label class="file">画像を開く<input id="file" type="file" accept="image/*"></label>
<button data-tool="pen">手書き</button>
<button data-tool="line" class="active">直線</button>
<button data-tool="arrow">矢印</button>
<button data-tool="rect">四角</button>
</div>
<div class="bar" style="margin-top:6px">
<label class="small">色 <input id="color" type="color" value="#ef4444"></label>
<label class="small">太さ <select id="width"><option>2</option><option selected>4</option><option>6</option><option>8</option><option>12</option></select></label>
<button id="undo">↶ 戻す</button>
<button id="clear">全消去</button>
<button id="save">PNG保存</button>
</div>
</header>
<div id="wrap"><canvas id="cv" width="900" height="1200"></canvas></div>
<div id="status">「画像を開く」から揚程図のスクリーンショットを選んでください。</div>
<div class="help">画像を選んだら、指でそのまま描けます。直線・矢印・四角は始点から終点までドラッグ。手書きは自由線。書込みは画像の上に重ねてPNG保存できます。</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),status=document.getElementById('status');
var img=null,imgW=900,imgH=1200,tool='line',down=false,start=null,active=null,items=[];
function say(t){status.textContent=t}
function style(){return{color:document.getElementById('color').value,width:Number(document.getElementById('width').value)}}
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function arrow(a,b,c,w){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();var q=Math.atan2(b.y-a.y,b.x-a.x),L=18+w*2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-L*Math.cos(q-.5),b.y-L*Math.sin(q-.5));ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-L*Math.cos(q+.5),b.y-L*Math.sin(q+.5));ctx.stroke()}
function drawItem(o){ctx.save();ctx.strokeStyle=o.color;ctx.lineWidth=o.width;ctx.lineCap='round';ctx.lineJoin='round';
if(o.type==='pen'){ctx.beginPath();for(var i=0;i<o.points.length;i++){var p=o.points[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke()}
if(o.type==='line'){ctx.beginPath();ctx.moveTo(o.a.x,o.a.y);ctx.lineTo(o.b.x,o.b.y);ctx.stroke()}
if(o.type==='arrow')arrow(o.a,o.b,o.color,o.width);
if(o.type==='rect')ctx.strokeRect(o.a.x,o.a.y,o.b.x-o.a.x,o.b.y-o.a.y);
ctx.restore()}
function redraw(){ctx.clearRect(0,0,cv.width,cv.height);if(img)ctx.drawImage(img,0,0,imgW,imgH);else{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#6b7280';ctx.font='28px system-ui';ctx.textAlign='center';ctx.fillText('画像を開いてください',cv.width/2,cv.height/2)}for(var i=0;i<items.length;i++)drawItem(items[i]);if(active)drawItem(active)}
document.querySelectorAll('[data-tool]').forEach(function(b){b.addEventListener('click',function(){tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(function(x){x.classList.toggle('active',x===b)});say(b.textContent+'：画像上をドラッグしてください')})});
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var url=URL.createObjectURL(f),n=new Image();n.onload=function(){img=n;var max=1800,s=Math.min(1,max/Math.max(n.naturalWidth,n.naturalHeight));imgW=Math.round(n.naturalWidth*s);imgH=Math.round(n.naturalHeight*s);cv.width=imgW;cv.height=imgH;items=[];active=null;redraw();URL.revokeObjectURL(url);say('画像を読み込みました。指で線を引けます。')};n.onerror=function(){URL.revokeObjectURL(url);say('画像を読み込めませんでした。')};n.src=url});
cv.addEventListener('pointerdown',function(e){if(!img)return;cv.setPointerCapture(e.pointerId);down=true;start=pos(e);var s=style();if(tool==='pen')active={type:'pen',points:[start],color:s.color,width:s.width};else active={type:tool,a:start,b:start,color:s.color,width:s.width};redraw()});
cv.addEventListener('pointermove',function(e){if(!down||!active)return;var p=pos(e);if(tool==='pen')active.points.push(p);else active.b=p;redraw()});
function finish(){if(!down)return;down=false;if(active){items.push(active);active=null;redraw()}}
cv.addEventListener('pointerup',finish);cv.addEventListener('pointercancel',finish);
document.getElementById('undo').addEventListener('click',function(){if(items.length){items.pop();redraw();say('1つ戻しました。')}});
document.getElementById('clear').addEventListener('click',function(){items=[];active=null;redraw();say('書込みを消しました。')});
document.getElementById('save').addEventListener('click',function(){if(!img)return say('先に画像を開いてください。');cv.toBlob(function(blob){if(!blob)return say('保存に失敗しました。');var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='oka_crane_chart.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);say('PNGを書き出しました。')},'image/png')});
redraw();
})();
</script>
</body>
</html>
