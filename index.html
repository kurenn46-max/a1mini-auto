<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>岡重機 揚程図作図 v3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="top">
    <div class="topline">
      <div class="title">岡重機 揚程図作図 v3</div>
      <label class="filebtn">画像<input id="file" type="file" accept="image/*"></label>
      <button id="save" class="btn">保存</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint" class="floating"></div>
    <div id="coords" class="floating">未校正</div>
    <div class="zoom floating">
      <button id="zin">＋</button>
      <button id="zout">−</button>
      <button id="fit" class="fit">全体</button>
    </div>
  </div>

  <div class="bottom">
    <div class="tools">
      <button class="tool active" data-mode="pan">移動</button>
      <button class="tool" id="calBtn">校正</button>
      <button class="tool" id="buildingBtn">建物</button>
      <button class="tool" id="pointBtn">作業点</button>
      <button class="tool" data-mode="measure">寸法</button>
      <button class="tool" data-mode="coord">座標</button>
      <button class="tool" data-mode="line">直線</button>
      <button class="tool" data-mode="arrow">矢印</button>
      <button class="tool" id="editBtn">管理</button>
    </div>
    <div id="status" class="status">まず画像を開く → 校正。2本指ズームはいつでも使えます。</div>
  </div>
</div>

<div id="sheetCal" class="sheetback">
  <div class="sheet">
    <h2>① 揚程図を校正</h2>
    <p>3点だけ指定します。<b>原点</b> → 横軸の既知点 → 縦軸の既知点。画像が少し傾いていても補正します。</p>
    <div class="grid">
      <label class="field">横軸の基準距離 (m)<input id="calX" type="number" value="5" step="0.1"></label>
      <label class="field">縦軸の基準高さ (m)<input id="calY" type="number" value="5" step="0.1"></label>
    </div>
    <div class="actions">
      <button data-close="sheetCal">閉じる</button>
      <button id="startCal" class="ok">校正開始</button>
    </div>
  </div>
</div>

<div id="sheetBuilding" class="sheetback">
  <div class="sheet">
    <h2>② 建物を実寸入力</h2>
    <div class="grid">
      <label class="field">旋回芯から手前 (m)<input id="bFront" type="number" value="10" step="0.1"></label>
      <label class="field">高さ (m)<input id="bHeight" type="number" value="12" step="0.1"></label>
      <label class="field">奥行 (m)<input id="bDepth" type="number" value="13" step="0.1"></label>
      <label class="field">名称<input id="bName" type="text" value="建物"></label>
    </div>
    <p>奥端は自動で「手前＋奥行」で計算します。</p>
    <div class="actions">
      <button data-close="sheetBuilding">閉じる</button>
      <button id="addBuilding" class="ok">建物を描く</button>
    </div>
  </div>
</div>

<div id="sheetPoint" class="sheetback">
  <div class="sheet">
    <h2>③ 作業点・作業半径</h2>
    <div class="grid">
      <label class="field">作業半径 R (m)<input id="pRadius" type="number" value="20" step="0.1"></label>
      <label class="field">高さ H (m)<input id="pHeight" type="number" value="8" step="0.1"></label>
      <label class="field">名称<input id="pName" type="text" value="作業点"></label>
      <label class="field">ガイド線
        <select id="pGuide"><option value="both">縦横</option><option value="vertical">縦のみ</option><option value="none">なし</option></select>
      </label>
    </div>
    <div class="actions">
      <button data-close="sheetPoint">閉じる</button>
      <button id="addPoint" class="ok">作業点を描く</button>
    </div>
  </div>
</div>

<div id="sheetEdit" class="sheetback">
  <div class="sheet">
    <h2>書込み管理</h2>
    <p id="countText">0個</p>
    <div class="smallrow">
      <label>線色 <input id="drawColor" class="color" type="color" value="#ef4444"></label>
      <label class="field" style="width:100px">線幅
        <select id="drawWidth"><option>2</option><option selected>4</option><option>6</option><option>8</option></select>
      </label>
    </div>
    <div class="actions">
      <button id="undo">1つ戻す</button>
      <button id="clearAll">全部消す</button>
    </div>
    <div class="actions"><button data-close="sheetEdit" class="ok">閉じる</button></div>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
