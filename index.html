<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>岡重機 揚程図ツール v4</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#e9edf2;color:#111827}button,input,select{font:inherit}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{background:#fff;padding:7px;border-color:#cbd5e1}.top{border-bottom:1px solid #cbd5e1}.bottom{border-top:1px solid #cbd5e1}.row,.tools{display:flex;gap:6px;align-items:center}.tools{overflow-x:auto}.title{font-weight:800;flex:1}.btn,.file,.tool{border:1px solid #94a3b8;background:#fff;border-radius:10px;min-height:42px;padding:7px 10px;font-weight:750;white-space:nowrap}.file{display:inline-flex;align-items:center}.file input{display:none}.tool.active{background:#111827;color:#fff}#stage{position:relative;overflow:hidden;background:#cdd4dc;touch-action:none}#workSvg{width:100%;height:100%;display:block;touch-action:none}.float{position:absolute;z-index:5}#hint{left:8px;right:8px;top:8px;background:rgba(255,255,255,.95);border:1px solid #cbd5e1;border-radius:10px;padding:7px 9px;font-size:12px;display:none}#coords{right:8px;top:8px;background:rgba(17,24,39,.86);color:#fff;border-radius:9px;padding:6px 9px;font-size:12px}.zoom{right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}.zoom button{width:44px;height:44px;border:1px solid #94a3b8;border-radius:12px;background:#fff;font-size:20px;font-weight:800}.status{font-size:11px;color:#475569;margin-top:4px}.sheet{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:20;display:none;align-items:flex-end}.sheet.show{display:flex}.card{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:14px;max-height:80vh;overflow:auto}.card h2{margin:0 0 10px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#475569}.field input,.field select{min-height:44px;border:1px solid #94a3b8;border-radius:9px;padding:7px;font-size:16px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;min-height:46px;border-radius:10px;border:1px solid #94a3b8;background:#fff;font-weight:800}.actions .ok{background:#111827;color:#fff}.spacer{flex:1}@media(min-width:800px){.card{max-width:560px;margin:0 auto 10px;border-radius:18px}}
</style></head><body><div id="app"><div class="top"><div class="row"><div class="title">岡重機 揚程図 v4</div><label class="file">画像<input id="file" type="file" accept="image/*"></label><button id="save" class="btn">保存</button></div></div><div id="stage"><svg id="workSvg"><g id="scene"><image id="bg" x="0" y="0"/><g id="overlay"></g></g></svg><div id="hint" class="float"></div><div id="coords" class="float">未校正</div><div class="zoom float"><button id="zin">＋</button><button id="zout">−</button><button id="fit" style="font-size:11px">全体</button></div></div><div class="bottom"><div class="tools"><button class="tool active" data-mode="move">移動</button><button class="tool" id="calBtn">校正</button><button class="tool" id="buildingBtn">建物</button><button class="tool" id="targetBtn">作業点</button><button class="tool" data-mode="measure">寸法</button><button class="tool" data-mode="coord">座標</button><button class="tool" data-mode="line">直線</button><button class="tool" id="undo">戻す</button><button class="tool" id="clear">全消去</button></div><div id="status" class="status">画像→校正→建物/作業点。ズームは＋−か2本指。</div></div></div>
<div id="calSheet" class="sheet"><div class="card"><h2>校正</h2><div class="grid"><label class="field">横軸基準(m)<input id="calX" type="number" value="5" step="0.1"></label><label class="field">縦軸基準(m)<input id="calY" type="number" value="5" step="0.1"></label></div><div class="actions"><button data-close="calSheet">閉じる</button><button id="calStart" class="ok">3点校正を開始</button></div></div></div>
<div id="buildingSheet" class="sheet"><div class="card"><h2>建物</h2><div class="grid"><label class="field">手前距離(m)<input id="bFront" type="number" value="10" step="0.1"></label><label class="field">高さ(m)<input id="bHeight" type="number" value="12" step="0.1"></label><label class="field">奥行(m)<input id="bDepth" type="number" value="13" step="0.1"></label><label class="field">名称<input id="bName" value="建物"></label></div><div class="actions"><button data-close="buildingSheet">閉じる</button><button id="buildingAdd" class="ok">描く</button></div></div></div>
<div id="targetSheet" class="sheet"><div class="card"><h2>作業点</h2><div class="grid"><label class="field">作業半径R(m)<input id="tR" type="number" value="20" step="0.1"></label><label class="field">高さH(m)<input id="tH" type="number" value="8" step="0.1"></label><label class="field">名称<input id="tName" value="作業点"></label><label class="field">ガイド<select id="tGuide"><option value="both">縦横</option><option value="vertical">縦のみ</option><option value="none">なし</option></select></label></div><div class="actions"><button data-close="targetSheet">閉じる</button><button id="targetAdd" class="ok">描く</button></div></div></div>
<script src="app-v4.js?v=4"></script></body></html>
